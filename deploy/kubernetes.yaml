apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-context-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-context-gateway
  template:
    metadata:
      labels:
        app: mcp-context-gateway
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: mcp-context-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-credentials
                  key: token
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-context-gateway
spec:
  selector:
    app: mcp-context-gateway
  ports:
    - port: 8080
      targetPort: 8080
